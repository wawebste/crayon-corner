<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<title>Crayon Corner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@600;800&family=Nunito:wght@500;700&display=swap">
<style>
/* Layout: one screen. A sheet of paper on a tabletop, crayons lined up along one edge, big round tools on the other. */
:root{
  --table:#2f6f8f;        /* blue craft table */
  --table-deep:#24576f;
  --paper:#fffdf7;
  --ink:#1f2a33;
  --ink-soft:#5b6b78;
  --sun:#ffc93c;          /* the one accent: selected tool, highlights */
  --chip:#ffffff;
  --display:"Grandstander","Comic Sans MS","Chalkboard SE",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--table);color:var(--ink);font-family:var(--body);overflow:hidden;
  background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.5px);background-size:22px 22px;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-bottom,0px))}

/* ---------- Picker ---------- */
.hubBtn{margin-left:auto;display:flex;align-items:center;gap:8px;background:#fff;color:var(--ink);text-decoration:none;font-family:var(--display);font-weight:800;font-size:18px;
  padding:10px 18px 10px 12px;border-radius:999px;box-shadow:0 4px 0 var(--table-deep)}
.hubBtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--table-deep)}
.hubBtn svg{width:28px;height:28px}

#picker{overflow-y:auto;gap:18px}
.brand{display:flex;align-items:center;gap:14px;padding-top:6px}
.brand h1{font-family:var(--display);font-weight:800;color:#fff;font-size:clamp(28px,5vw,44px);margin:0;letter-spacing:.5px;text-wrap:balance}
.brand svg{width:52px;height:52px;flex:none}
.shelf{background:rgba(255,255,255,.1);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:14px}
.shelf h2{margin:0;font-family:var(--display);font-weight:800;color:#fff;font-size:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
.tile{background:var(--paper);border-radius:14px;aspect-ratio:1;max-width:100%;padding:8px;box-shadow:0 4px 0 var(--table-deep);transition:transform .12s}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--table-deep)}
.tile img,.tile canvas{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.topics{display:flex;flex-wrap:wrap;gap:10px}
.topic{background:var(--chip);border-radius:999px;padding:10px 18px;font-family:var(--display);font-weight:600;font-size:18px;box-shadow:0 3px 0 var(--table-deep)}
.topic[aria-pressed="true"]{background:var(--sun)}

/* ---------- Coloring ---------- */
#studio{display:grid;gap:12px;grid-template-columns:96px minmax(0,1fr) 84px;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"crayons pats tools" "crayons stage tools"}
.pats{grid-area:pats;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.pat{width:54px;height:54px;border-radius:50%;padding:4px;background:var(--chip);box-shadow:0 4px 0 var(--table-deep);position:relative}
.pat canvas{width:100%;height:100%;border-radius:50%;display:block}
.pat[aria-pressed="true"]{background:var(--sun);transform:translateY(-3px)}
.pat:active{transform:translateY(2px);box-shadow:0 1px 0 var(--table-deep)}
@media (orientation:portrait){
  #studio{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-areas:"tools" "pats" "stage" "crayons"}
}
.stage{grid-area:stage;position:relative;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0}
.sheet{position:relative;background:var(--paper);border-radius:6px;box-shadow:0 10px 0 rgba(0,0,0,.18);touch-action:none}
.sheet canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:6px}
#lineLayer{pointer-events:none}

.crayons{grid-area:crayons;display:flex;flex-direction:column;gap:6px;overflow-y:auto;overflow-x:hidden;padding:4px 0;align-items:flex-start}
.crayon{position:relative;width:78px;height:34px;flex:none;transition:transform .15s}
.crayon .body{position:absolute;left:0;top:3px;width:60px;height:28px;border-radius:5px 0 0 5px;background:var(--c);
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.15),inset 0 6px 0 rgba(255,255,255,.2)}
.crayon .body::before,.crayon .body::after{content:"";position:absolute;top:0;bottom:0;width:4px;background:rgba(0,0,0,.18)}
.crayon .body::before{left:10px}.crayon .body::after{left:46px}
.crayon .tip{position:absolute;left:58px;top:3px;width:20px;height:28px;background:var(--c);clip-path:polygon(0 0,100% 42%,100% 58%,0 100%);filter:brightness(.88)}
.crayon[aria-pressed="true"]{transform:translateX(14px)}
.crayon[aria-pressed="true"] .body{outline:3px solid #fff;outline-offset:1px}
@media (orientation:portrait){
  .crayons{flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:0 4px 4px;align-items:flex-end;height:96px}
  .crayon{width:34px;height:78px}
  .crayon .body{left:3px;top:auto;bottom:0;width:28px;height:60px;border-radius:0 0 5px 5px}
  .crayon .body::before,.crayon .body::after{left:0;right:0;width:auto;height:4px}
  .crayon .body::before{top:auto;bottom:10px}.crayon .body::after{top:14px;bottom:auto}
  .crayon .tip{left:3px;top:0;width:28px;height:20px;clip-path:polygon(42% 0,58% 0,100% 100%,0 100%)}
  .crayon[aria-pressed="true"]{transform:translateY(-14px)}
}

.tools{grid-area:tools;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:flex-start}
@media (orientation:portrait){.tools{flex-direction:row;justify-content:center;flex-wrap:wrap}}
.tool{width:68px;height:68px;border-radius:50%;background:var(--chip);display:grid;place-items:center;box-shadow:0 4px 0 var(--table-deep);position:relative}
.tool svg{width:36px;height:36px}
.tool[aria-pressed="true"]{background:var(--sun)}
.tool:active{transform:translateY(3px);box-shadow:0 1px 0 var(--table-deep)}
.tool.armed{background:#ff6b5a;color:#fff}
.tool .lbl{position:absolute;bottom:-18px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap}
.spacer{flex:1}
@media (orientation:portrait){.spacer{display:none}.tool .lbl{display:none}}
.brushdot{width:30px;height:30px;border-radius:50%;background:var(--cur,#e63946);background-size:cover;border:3px solid var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<section id="picker" class="screen">
  <div class="brand">
    <svg viewBox="0 0 52 52" aria-hidden="true"><rect x="4" y="18" width="34" height="16" rx="3" fill="#ffc93c"/><path d="M38 18 L50 26 L38 34Z" fill="#e6a919"/><rect x="12" y="18" width="3" height="16" fill="#e6a919"/><rect x="28" y="18" width="3" height="16" fill="#e6a919"/></svg>
    <h1>Crayon Corner</h1>
    <a class="hubBtn" href="../" aria-label="Back to all apps"><svg viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"><path d="M5 17 L18 6 L31 17"/><path d="M9 15 V30 H27 V15"/><path d="M15 30 V22 H21 V30"/></svg>All apps</a>
  </div>

  <div class="shelf">
    <div class="topics" id="topics" role="tablist" aria-label="Picture types"></div>
    <div class="grid" id="pageGrid"></div>
  </div>
</section>

<section id="studio" class="screen" hidden>
  <div class="crayons" id="crayons" role="toolbar" aria-label="Colors"></div>
  <div class="pats" id="pats" role="toolbar" aria-label="Patterns"></div>
  <div class="stage" id="stage">
    <div class="sheet" id="sheet">
      <canvas id="colorLayer"></canvas>
      <canvas id="lineLayer"></canvas>
    </div>
  </div>
  <div class="tools" role="toolbar" aria-label="Tools">
    <button class="tool" id="homeBtn" aria-label="Pick another picture">
      <svg viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"><path d="M5 17 L18 6 L31 17"/><path d="M9 15 V30 H27 V15"/><path d="M15 30 V22 H21 V30"/></svg>
      <span class="lbl">Pictures</span>
    </button>
    <button class="tool" id="fillBtn" aria-pressed="true" aria-label="Fill: tap a space to color it">
      <svg viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M8 14 L18 4 L30 16 L20 26 Z"/><path d="M8 14 H30"/><path d="M30 22 C33 26 33 29 30.5 30 C28 29 28 26 30 22Z" fill="var(--cur,#e63946)" stroke="none"/></svg>
      <span class="lbl">Fill</span>
    </button>
    <button class="tool" id="brushBtn" aria-pressed="false" aria-label="Crayon: draw with your finger">
      <div class="brushdot"></div>
      <span class="lbl">Draw</span>
    </button>
    <button class="tool" id="undoBtn" aria-label="Undo">
      <svg viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8 L5 15 L12 22"/><path d="M5 15 H21 C27 15 31 19 31 24 C31 29 27 31 22 31 H15"/></svg>
      <span class="lbl">Undo</span>
    </button>
    <div class="spacer"></div>
    <button class="tool" id="clearBtn" aria-label="Start over">
      <svg viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M9 9 L27 27 M27 9 L9 27"/></svg>
      <span class="lbl" id="clearLbl">Start over</span>
    </button>
  </div>
</section>

<script>
/* Crayon Corner coloring pages. Each page draws on an 800x800 white canvas with black outlines.
   Shapes are drawn back-to-front with a white fill, so later shapes hide earlier lines. */
var CC_PAGES=(function(){
"use strict";
const P=Math.PI;
let x; // current 2d context
function S(f){x.beginPath();f();x.fillStyle="#fff";x.fill();x.stroke();}          // white shape + outline
function L(f){x.beginPath();f();x.stroke();}                                        // line only
function D(f){x.beginPath();f();x.fillStyle="#111";x.fill();}                       // solid dark (pupils, noses)
function C(cx,cy,r){x.moveTo(cx+r,cy);x.arc(cx,cy,r,0,P*2);}
function E(cx,cy,rx,ry,rot){rot=rot||0;x.moveTo(cx+rx*Math.cos(rot),cy+rx*Math.sin(rot));x.ellipse(cx,cy,rx,ry,rot,0,P*2);}
function RR(X,Y,w,h,r){x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();}
function poly(pts){x.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)x.lineTo(pts[i],pts[i+1]);x.closePath();}
// draw fn in a local frame: centre (cx,cy), scale s, rotation, optional mirror. Line weight stays the same on the page.
function T(cx,cy,s,fn,rot,flip){x.save();x.translate(cx,cy);x.rotate(rot||0);x.scale(flip?-s:s,s);x.lineWidth=8/s;fn();x.restore();}
function M(fn){fn();x.save();x.scale(-1,1);fn();x.restore();} // draw, then mirror across x=0
function clip(pathFn,fn){x.save();x.beginPath();pathFn();x.clip();fn();x.restore();}

/* ---------- scenery ---------- */
function star(cx,cy,r,n){n=n||5;x.moveTo(cx,cy-r);for(let i=1;i<n*2;i++){const a=-P/2+i*P/n,rr=i%2?r*.45:r;x.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr);}x.closePath();}
function stars(list){list.forEach(s=>S(()=>star(s[0],s[1],s[2])));}
function heart(cx,cy,s){x.moveTo(cx,cy+s*.85);x.bezierCurveTo(cx-s*1.35,cy-s*.05,cx-s*.65,cy-s*1.15,cx,cy-s*.4);x.bezierCurveTo(cx+s*.65,cy-s*1.15,cx+s*1.35,cy-s*.05,cx,cy+s*.85);x.closePath();}
function cloud(cx,cy,s){x.moveTo(cx-s,cy+s*.4);x.bezierCurveTo(cx-s*1.45,cy+s*.4,cx-s*1.35,cy-s*.35,cx-s*.8,cy-s*.22);
  x.bezierCurveTo(cx-s*.8,cy-s*.85,cx,cy-s*.95,cx+s*.1,cy-s*.45);x.bezierCurveTo(cx+s*.3,cy-s*.85,cx+s*1.05,cy-s*.75,cx+s*.88,cy-s*.1);
  x.bezierCurveTo(cx+s*1.45,cy-s*.1,cx+s*1.45,cy+s*.4,cx+s,cy+s*.4);x.closePath();}
function sun(cx,cy,r,face){for(let i=0;i<12;i++){const a=i*P/6;L(()=>{x.moveTo(cx+Math.cos(a)*(r+18),cy+Math.sin(a)*(r+18));x.lineTo(cx+Math.cos(a)*(r+48),cy+Math.sin(a)*(r+48));});}
  S(()=>C(cx,cy,r));if(face){D(()=>{C(cx-r*.3,cy-r*.15,r*.09);C(cx+r*.3,cy-r*.15,r*.09);});L(()=>x.arc(cx,cy+r*.05,r*.4,P*.2,P*.8));}}
function ground(y){L(()=>{x.moveTo(0,y);x.lineTo(800,y);});}
function hills(y){S(()=>{x.moveTo(-10,810);x.lineTo(-10,y);x.quadraticCurveTo(200,y-90,420,y);x.quadraticCurveTo(620,y+70,810,y-40);x.lineTo(810,810);x.closePath();});}
function tufts(list){list.forEach(([a,b])=>L(()=>{x.moveTo(a-14,b-22);x.lineTo(a-4,b);x.lineTo(a,b-30);x.lineTo(a+4,b);x.lineTo(a+14,b-22);}));}
function bubbles(list){list.forEach(b=>S(()=>C(b[0],b[1],b[2])));}
function waves(y,amp,wave){amp=amp||14;wave=wave||100;S(()=>{x.moveTo(-10,810);x.lineTo(-10,y);for(let i=-10;i<810;i+=wave)x.quadraticCurveTo(i+wave/2,y-amp*2,i+wave,y);x.lineTo(810,810);x.closePath();});}
function waveLine(y,amp,wave){L(()=>{x.moveTo(-10,y);for(let i=-10;i<810;i+=wave)x.quadraticCurveTo(i+wave/2,y-amp*2,i+wave,y);});}
function seaweed(bx,by,h,lean){S(()=>{x.moveTo(bx-14,by);x.bezierCurveTo(bx-50+lean,by-h*.35,bx+30+lean,by-h*.65,bx+lean,by-h);
  x.bezierCurveTo(bx+50+lean,by-h*.65,bx-20+lean,by-h*.35,bx+14,by);x.closePath();});}
function grassBlade(bx,by,h){S(()=>{x.moveTo(bx-10,by);x.quadraticCurveTo(bx-6,by-h*.6,bx+10,by-h);x.quadraticCurveTo(bx+4,by-h*.5,bx+10,by);x.closePath();});}
function sparkle(cx,cy,r){S(()=>{x.moveTo(cx,cy-r);x.quadraticCurveTo(cx+r*.15,cy-r*.15,cx+r,cy);x.quadraticCurveTo(cx+r*.15,cy+r*.15,cx,cy+r);
  x.quadraticCurveTo(cx-r*.15,cy+r*.15,cx-r,cy);x.quadraticCurveTo(cx-r*.15,cy-r*.15,cx,cy-r);x.closePath();});}
function gull(cx,cy,s){L(()=>{x.moveTo(cx-s,cy);x.quadraticCurveTo(cx-s/2,cy-s*.6,cx,cy);x.quadraticCurveTo(cx+s/2,cy-s*.6,cx+s,cy);});}
function rainbow(cx,cy,r,bands,w){for(let i=0;i<bands;i++){const ro=r-i*w;S(()=>{x.moveTo(cx-ro,cy);x.arc(cx,cy,ro,P,0);x.lineTo(cx+ro-w,cy);x.arc(cx,cy,ro-w,0,P,true);x.closePath();});}}
function zzz(cx,cy,s){[[0,0,1],[s*1.1,-s*1.2,.75],[s*2,-s*2.2,.55]].forEach(([dx,dy,k])=>{const z=s*k;L(()=>{x.moveTo(cx+dx,cy+dy);x.lineTo(cx+dx+z,cy+dy);x.lineTo(cx+dx,cy+dy+z);x.lineTo(cx+dx+z,cy+dy+z);});});}

/* ---------- flowers ---------- */
function petalFlower(cx,cy,r,n,pw,center){for(let i=0;i<n;i++){const a=i*2*P/n-P/2;S(()=>E(cx+Math.cos(a)*r,cy+Math.sin(a)*r,r*.78,pw||r*.42,a));}S(()=>C(cx,cy,center||r*.55));}
function roundFlower(cx,cy,r){for(let i=0;i<5;i++){const a=i*2*P/5-P/2;S(()=>C(cx+Math.cos(a)*r,cy+Math.sin(a)*r,r*.72));}S(()=>C(cx,cy,r*.6));}
function stem(x1,y1,x2,y2,w){w=w||9;const mx=(x1+x2)/2+(x2===x1?18:0);S(()=>{x.moveTo(x1-w,y1);x.quadraticCurveTo(mx-w,(y1+y2)/2,x2-w,y2);x.lineTo(x2+w,y2);x.quadraticCurveTo(mx+w,(y1+y2)/2,x1+w,y1);x.closePath();});}
function leaf(cx,cy,len,rot,vein){T(cx,cy,1,()=>{S(()=>{x.moveTo(0,0);x.quadraticCurveTo(len*.5,-len*.38,len,0);x.quadraticCurveTo(len*.5,len*.38,0,0);x.closePath();});
  if(vein!==false)L(()=>{x.moveTo(len*.1,0);x.lineTo(len*.85,0);});},rot);}
function tulipHead(cx,cy,s){T(cx,cy,s,()=>{S(()=>{x.moveTo(-100,-80);x.lineTo(-50,-25);x.lineTo(0,-110);x.lineTo(50,-25);x.lineTo(100,-80);
  x.bezierCurveTo(115,60,45,110,0,110);x.bezierCurveTo(-45,110,-115,60,-100,-80);x.closePath();});
  L(()=>{x.moveTo(-50,-25);x.quadraticCurveTo(-40,60,0,108);x.moveTo(50,-25);x.quadraticCurveTo(40,60,0,108);});});}
function sunflowerHead(cx,cy,r){for(let i=0;i<18;i++){const a=i*2*P/18;T(cx,cy,1,()=>S(()=>{x.moveTo(r*.8,-r*.16);x.quadraticCurveTo(r*1.5,-r*.22,r*1.75,0);x.quadraticCurveTo(r*1.5,r*.22,r*.8,r*.16);x.closePath();}),a);}
  S(()=>C(cx,cy,r));clip(()=>C(cx,cy,r-6),()=>{x.lineWidth=5;for(let i=-r;i<=r;i+=r/3.2){L(()=>{x.moveTo(cx+i-r,cy-r);x.lineTo(cx+i+r,cy+r);});L(()=>{x.moveTo(cx+i+r,cy-r);x.lineTo(cx+i-r,cy+r);});}});}
function ladybug(cx,cy,s,rot){T(cx,cy,s,()=>{
  L(()=>{for(const sy of[-1,1])for(const lx of[-30,0,30]){x.moveTo(lx,0);x.lineTo(lx+sy*0+(lx>0?20:lx<0?-20:0),sy*95);}});
  L(()=>{x.moveTo(-15,-95);x.quadraticCurveTo(-30,-140,-45,-150);x.moveTo(15,-95);x.quadraticCurveTo(30,-140,45,-150);});
  S(()=>{x.moveTo(-55,-60);x.arc(0,-60,55,P,0);x.closePath();});
  S(()=>E(0,10,80,90));L(()=>{x.moveTo(0,-80);x.lineTo(0,100);});
  S(()=>{C(-38,-10,16);C(38,-10,16);C(-42,45,13);C(42,45,13);C(-18,75,10);C(18,75,10);});
  D(()=>{C(-20,-80,7);C(20,-80,7);});},rot||0);}

/* ---------- animals ---------- */
function dogHead(o){o=o||{};
  if(o.ears==="up")M(()=>S(()=>poly([-90,-30,-78,-150,-18,-80])));
  S(()=>E(0,0,100,90));
  if(o.spot)S(()=>E(42,-40,30,24,.3));
  if(o.ears!=="up")M(()=>S(()=>E(-92,10,34,74,.32)));
  if(o.sleep)M(()=>L(()=>x.arc(-38,-15,16,P*.15,P*.85)));
  else M(()=>{S(()=>C(-38,-15,15));D(()=>C(-35,-12,8));});
  if(o.tongue)S(()=>E(0,78,15,22));
  S(()=>E(0,40,50,36));
  D(()=>E(0,22,17,11));
  L(()=>{x.moveTo(0,33);x.lineTo(0,50);x.moveTo(0,50);x.quadraticCurveTo(-16,64,-32,52);x.moveTo(0,50);x.quadraticCurveTo(16,64,32,52);});
}
function bone(cx,cy,s,rot){T(cx,cy,s,()=>{S(()=>{C(-60,-16,20);});S(()=>C(-60,16,20));S(()=>C(60,-16,20));S(()=>C(60,16,20));
  x.beginPath();x.rect(-62,-15,124,30);x.fillStyle="#fff";x.fill();L(()=>{x.moveTo(-58,-15);x.lineTo(58,-15);x.moveTo(-58,15);x.lineTo(58,15);});},rot||0);}
function dogSit(o){o=o||{};
  S(()=>E(115,-95,70,18,-.9));
  M(()=>S(()=>E(-120,-10,42,16)));
  M(()=>S(()=>E(-95,-62,60,66)));
  S(()=>E(0,-140,95,130));
  M(()=>{S(()=>E(-38,-58,24,60));S(()=>E(-40,-10,34,16));});
  S(()=>RR(-62,-226,124,24,10));S(()=>C(0,-196,13));
  T(0,-290,.9,()=>dogHead(o));

/* ---------- Patterns (work with any crayon color, for Fill and Draw) ---------- */
const PATS=[["plain","Plain color"],["stripes","Stripes"],["zigzag","Zigzags"],["dots","Polka dots"],["glitter","Glitter"]];
let pat="plain";const tileCache={};
function rgbOf(c){const n=parseInt(c.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255];}
function mix(c,k,to){const v=rgbOf(c),t=to==="dark"?0:255;return "rgb("+v.map(x=>Math.round(x+(t-x)*k)).join(",")+")";}

  b.setAttribute("aria-pressed",name===pat?"true":"false");
  const cv=document.createElement("canvas");cv.width=cv.height=92;b.appendChild(cv);
  b.onclick=()=>{pat=name;patBox.querySelectorAll(".pat").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));drawPatButtons();};
  patBox.appendChild(b);
});
function drawPatButtons(){
  patBox.querySelectorAll(".pat").forEach(b=>{const cv=b.querySelector("canvas"),g=cv.getContext("2d");
    g.clearRect(0,0,92,92);g.fillStyle=g.createPattern(tile(b.dataset.p,cur),"repeat");g.fillRect(0,0,92,92);});
  const dot=document.querySelector(".brushdot");
  if(dot)dot.style.backgroundImage=pat==="plain"?"":"url("+tile(pat,cur).toDataURL()+")";
}
drawPatButtons();

/* ---------- Saved pictures (kept on this tablet until Start over) ---------- */
const store=(function(){let dbp=null;
  function db(){if(!dbp)dbp=new Promise((res,rej)=>{try{const q=indexedDB.open("crayon-corner",1);
    q.onupgradeneeded=()=>q.result.createObjectStore("pics");q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);}catch(e){rej(e);}});return dbp;}
  function tx(mode,fn){return db().then(d=>new Promise((res,rej)=>{const t=d.transaction("pics",mode);const q=fn(t.objectStore("pics"));
    t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);}));}
  return{get:k=>tx("readonly",st=>st.get(k)).catch(()=>null),
         put:(k,v)=>tx("readwrite",st=>st.put(v,k)).catch(()=>{}),
         del:k=>tx("readwrite",st=>st.delete(k)).catch(()=>{})};})();
function blobImg(b){return new Promise((res,rej)=>{const u=URL.createObjectURL(b),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);res(i);};i.onerror=rej;i.src=u;});}

/* ---------- Picture picker ---------- */
const CATS=CC_PAGES.cats,topicsEl=$("#topics"),grid=$("#pageGrid");
let curCat=Object.keys(CATS)[0];
try{const saved=localStorage.getItem("cc-cat");if(saved&&CATS[saved])curCat=saved;}catch(e){}
Object.keys(CATS).forEach(name=>{
  const b=document.createElement("button");b.className="topic";b.textContent=name;b.setAttribute("role","tab");
  b.onclick=()=>showCat(name);topicsEl.appendChild(b);
});
function showCat(name){
  curCat=name;try{localStorage.setItem("cc-cat",name);}catch(e){}
  topicsEl.querySelectorAll(".topic").forEach(t=>t.setAttribute("aria-pressed",t.textContent===name?"true":"false"));
  grid.innerHTML="";
  CATS[name].forEach((p,i)=>{
    const t=document.createElement("button");t.className="tile";t.setAttribute("aria-label",p[0]);
    const id=name+"/"+i,big=CC_PAGES.render(name,i,document.createElement("canvas"));
    const th=document.createElement("canvas");th.width=th.height=240;const tx2=th.getContext("2d");tx2.drawImage(big,0,0,240,240);
    store.get(id).then(b=>b&&blobImg(b)).then(img=>{if(!img||curCat!==name)return;
      tx2.drawImage(img,0,0,240,240);tx2.globalCompositeOperation="multiply";tx2.drawImage(big,0,0,240,240);tx2.globalCompositeOperation="source-over";}).catch(()=>{});
    t.appendChild(th);t.onclick=()=>openPage(CC_PAGES.render(name,i,document.createElement("canvas")),id);grid.appendChild(t);
  });
}
showCat(curCat);

/* ---------- Coloring ---------- */
const sheet=$("#sheet"),colorC=$("#colorLayer"),lineC=$("#lineLayer"),cx=colorC.getContext("2d",{willReadFrequently:true}),lx=lineC.getContext("2d");
let W=0,H=0,wall=null,undo=[],curId=null,saveT=null;
function openPage(src,id){
  curId=id;
  // scale to working size
  const s=Math.min(MAX/src.width,MAX/src.height,1.25);
  W=Math.round(src.width*s);H=Math.round(src.height*s);
  [colorC,lineC].forEach(c=>{c.width=W;c.height=H;});
  lx.drawImage(src,0,0,W,H);
  const d=lx.getImageData(0,0,W,H),p=d.data;wall=new Uint8Array(W*H);
  for(let i=0,j=0;i<p.length;i+=4,j++){
    const l=(p[i]*3+p[i+1]*6+p[i+2])/10;
    if(l<170)wall[j]=1;
    const a=Math.min(255,Math.max(0,(255-l)*1.6));
    p[i]=p[i+1]=p[i+2]=25;p[i+3]=a; // turn the drawing into ink on clear film
  }
  lx.putImageData(d,0,0);
  cx.fillStyle="#fff";cx.fillRect(0,0,W,H);undo=[];
  store.get(id).then(b=>b&&blobImg(b)).then(img=>{if(img&&curId===id&&!undo.length)cx.drawImage(img,0,0,W,H);}).catch(()=>{});
  $("#picker").hidden=true;$("#studio").hidden=false;fit();disarm();
}
function fit(){
  const st=$("#stage").getBoundingClientRect();if(!W||!st.width)return;
  const s=Math.min(st.width/W,st.height/H);sheet.style.width=Math.floor(W*s)+"px";sheet.style.height=Math.floor(H*s)+"px";
}
new ResizeObserver(fit).observe($("#stage"));
function saveNow(){clearTimeout(saveT);saveT=null;const id=curId;if(!id)return;
  try{colorC.toBlob(b=>{if(b)store.put(id,b);},"image/png");}catch(e){}}
function queueSave(){clearTimeout(saveT);saveT=setTimeout(saveNow,600);}
function snap(){undo.push(cx.getImageData(0,0,W,H));if(undo.length>15)undo.shift();}
function hex(c){const n=parseInt(c.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255];}

// Find the space (between the lines) at a point. Returns its outline as a mask:
// the open pixels plus the pixels just under the ink, so no white halo is left.
function regionAt(px,py){
  px=Math.floor(px);py=Math.floor(py);
  if(px<0||py<0||px>=W||py>=H)return null;
  let start=py*W+px;
  if(wall[start]){ // tapped on a line: nudge to the nearest open spot
    let best=-1;for(let r=1;r<8&&best<0;r++)for(let dy=-r;dy<=r&&best<0;dy++)for(let dx=-r;dx<=r;dx++){
      const x=px+dx,y=py+dy;if(x>=0&&y>=0&&x<W&&y<H&&!wall[y*W+x]){best=y*W+x;break;}}
    if(best<0)return null;start=best;}
  const seen=new Uint8Array(W*H),stack=[start];seen[start]=1;
  let x0=W,y0=H,x1=0,y1=0;
  const mark=k=>{seen[k]=2;const x=k%W,y=(k/W)|0;if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;};
  while(stack.length){const k=stack.pop();mark(k);const x=k%W;
    const nb=[x>0?k-1:-1,x<W-1?k+1:-1,k-W,k+W];
    for(const n of nb){if(n<0||n>=W*H||seen[n])continue;seen[n]=1;
      if(wall[n]){mark(n);continue;}
      stack.push(n);}
  }
  const w=x1-x0+1,h=y1-y0+1,m=document.createElement("canvas");m.width=w;m.height=h;
  const mg=m.getContext("2d"),img=mg.createImageData(w,h),d=img.data;
  for(let y=y0;y<=y1;y++){let k=y*W+x0,o=((y-y0)*w)*4+3;for(let x=x0;x<=x1;x++,k++,o+=4)if(seen[k]===2)d[o]=255;}
  mg.putImageData(img,0,0);
  return {x0,y0,w,h,mask:m};
}
const tmp=document.createElement("canvas"),tg=tmp.getContext("2d");
// paint a box of the page through a region's mask
function paintIn(reg,bx,by,bw,bh,draw){
  const ax=Math.max(bx,reg.x0),ay=Math.max(by,reg.y0),ex=Math.min(bx+bw,reg.x0+reg.w),ey=Math.min(by+bh,reg.y0+reg.h);
  if(ex<=ax||ey<=ay)return;
  const w=ex-ax,h=ey-ay;
  if(tmp.width<w||tmp.height<h){tmp.width=Math.max(tmp.width,w);tmp.height=Math.max(tmp.height,h);}
  tg.save();tg.globalCompositeOperation="source-over";tg.clearRect(0,0,w,h);
  tg.translate(-ax,-ay);draw(tg,ax,ay);tg.restore();
  tg.save();tg.globalCompositeOperation="destination-in";tg.drawImage(reg.mask,ax-reg.x0,ay-reg.y0,w,h,0,0,w,h);tg.restore();
  cx.drawImage(tmp,0,0,w,h,ax,ay,w,h);
}
function fill(px,py){
  const reg=regionAt(px,py);if(!reg)return;
  snap();
  paintIn(reg,reg.x0,reg.y0,reg.w,reg.h,(g,ox,oy)=>{g.fillStyle=paint(g,0,0);g.fillRect(ox,oy,reg.w,reg.h);});
  queueSave();
}

// Draw: the crayon stays inside the space where the stroke started
let drawing=false,last=null,brushReg=null;
function toCanvas(e){const b=sheet.getBoundingClientRect();return[(e.clientX-b.left)*W/b.width,(e.clientY-b.top)*H/b.height];}
sheet.addEventListener("pointerdown",e=>{e.preventDefault();disarm();const [x,y]=toCanvas(e);
  if(mode==="fill"){fill(x,y);return;}
  brushReg=regionAt(x,y);if(!brushReg)return;
  snap();drawing=true;last=[x,y];sheet.setPointerCapture(e.pointerId);stroke(x,y);});
sheet.addEventListener("pointermove",e=>{if(!drawing)return;const [x,y]=toCanvas(e);stroke(x,y);});
["pointerup","pointercancel"].forEach(t=>sheet.addEventListener(t,()=>{if(drawing)queueSave();drawing=false;brushReg=null;}));
function stroke(x,y){
  const lw=Math.max(W,H)/40,p=lw/2+2;
  const bx=Math.floor(Math.min(last[0],x)-p),by=Math.floor(Math.min(last[1],y)-p);
  const bw=Math.ceil(Math.abs(x-last[0])+p*2)+1,bh=Math.ceil(Math.abs(y-last[1])+p*2)+1;
  const a=last;
  paintIn(brushReg,bx,by,bw,bh,g=>{g.strokeStyle=paint(g,0,0);g.lineWidth=lw;g.lineCap="round";g.lineJoin="round";
    g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(x+.01,y);g.stroke();});
  last=[x,y];
}

function setMode(m){mode=m;$("#fillBtn").setAttribute("aria-pressed",m==="fill");$("#brushBtn").setAttribute("aria-pressed",m==="brush");disarm();}
$("#fillBtn").onclick=()=>setMode("fill");
$("#brushBtn").onclick=()=>setMode("brush");
$("#undoBtn").onclick=()=>{disarm();const u=undo.pop();if(u){cx.putImageData(u,0,0);queueSave();}};
$("#homeBtn").onclick=()=>{if(saveT)saveNow();$("#studio").hidden=true;$("#picker").hidden=false;setTimeout(()=>showCat(curCat),150);};
// Start over needs two taps so a stray bump doesn't wipe the picture
let armed=false,armT;
const clearBtn=$("#clearBtn");
function disarm(){armed=false;clearBtn.classList.remove("armed");$("#clearLbl").textContent="Start over";clearTimeout(armT);}
clearBtn.onclick=()=>{
  if(!armed){armed=true;clearBtn.classList.add("armed");$("#clearLbl").textContent="Tap again";armT=setTimeout(disarm,2500);return;}
  disarm();snap();cx.fillStyle="#fff";cx.fillRect(0,0,W,H);clearTimeout(saveT);saveT=null;if(curId)store.del(curId);};
document.documentElement.style.setProperty("--cur",cur);
document.addEventListener("visibilitychange",()=>{if(document.hidden&&saveT)saveNow();});
})();
</script>

</body>
</html>

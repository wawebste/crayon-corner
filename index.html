<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<title>Playroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: a playroom wall. Each app is a toy box sitting on its own wooden shelf plank. */
:root{
  --wall:#5b6fd6;        /* periwinkle wall */
  --wall-dot:rgba(255,255,255,.08);
  --plank:#b7793f;       /* wooden shelf */
  --plank-edge:#8a5629;
  --box:#ffffff;
  --ink:#1f2a33;
  --sun:#ffc93c;
  --display:"Grandstander","Comic Sans MS","Chalkboard SE",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--wall);color:var(--ink);font-family:var(--body);
  background-image:radial-gradient(var(--wall-dot) 2px,transparent 2.5px);background-size:28px 28px;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:clamp(24px,5vh,48px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:max(28px,env(safe-area-inset-top,0px)) max(28px,env(safe-area-inset-bottom,0px))}

header{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
h1{margin:0;font-family:var(--display);font-weight:800;color:#fff;font-size:clamp(44px,9vw,84px);line-height:1;letter-spacing:1px;text-wrap:balance;
  text-shadow:0 5px 0 rgba(0,0,0,.18)}
h1 .o{display:inline-block;color:var(--sun)}
.hello{margin:0;color:#e9ecff;font-family:var(--display);font-weight:600;font-size:clamp(18px,3vw,24px)}

.shelf{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(20px,4vw,40px);width:100%;max-width:1000px}
.app{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:inherit;width:clamp(200px,40vw,260px);outline:none}
.box{width:100%;aspect-ratio:1;max-width:100%;background:var(--box);border-radius:28px;display:grid;place-items:center;
  box-shadow:inset 0 -8px 0 rgba(0,0,0,.08);transition:transform .15s ease}
.box svg{width:72%;height:72%}
.app:active .box{transform:translateY(6px) scale(.98)}
.app:focus-visible .box{outline:6px solid var(--sun);outline-offset:4px}
.plank{width:118%;height:22px;margin-top:0;background:var(--plank);border-radius:6px;box-shadow:inset 0 -7px 0 var(--plank-edge),0 6px 0 rgba(0,0,0,.12)}
.name{margin-top:14px;font-family:var(--display);font-weight:800;font-size:clamp(24px,4vw,30px);color:#fff;text-align:center}
.go{margin-top:10px;display:inline-flex;align-items:center;gap:8px;background:var(--sun);color:var(--ink);font-family:var(--display);font-weight:800;font-size:22px;
  padding:12px 30px;border-radius:999px;box-shadow:0 5px 0 #d79f12}
.app:active .go{transform:translateY(4px);box-shadow:0 1px 0 #d79f12}
.go svg{width:22px;height:22px}
@media (prefers-reduced-motion:no-preference){
  .app:hover .box{transform:translateY(-6px) rotate(-1.5deg)}
}
</style>
</head>
<body>
<main>
  <header>
    <h1>Pl<span class="o">a</span>yroom</h1>
    <p class="hello">What do you want to play?</p>
  </header>
  <nav class="shelf" id="shelf" aria-label="Apps"></nav>
</main>

<script>
/* ===== The app list. To add a new app, copy one entry and change it. =====
   name: what kids see
   href: the app's folder in this site (each app lives in its own folder with an index.html)
   icon: a small SVG picture drawn inside the white box                                  */
const APPS = [
  {
    name: "Crayon Corner",
    href: "crayon-corner/",
    icon: `<svg viewBox="0 0 200 200" aria-hidden="true">
      <g transform="rotate(-75 40 160)"><rect x="40" y="143" width="105" height="34" rx="5" fill="#e63946"/><path d="M145 143 L175 160 L145 177Z" fill="#b82d38"/><rect x="58" y="143" width="6" height="34" fill="#b82d38"/><rect x="122" y="143" width="6" height="34" fill="#b82d38"/></g>
      <g transform="rotate(-48 40 160)"><rect x="40" y="143" width="105" height="34" rx="5" fill="#ffc93c"/><path d="M145 143 L175 160 L145 177Z" fill="#e0a516"/><rect x="58" y="143" width="6" height="34" fill="#e0a516"/><rect x="122" y="143" width="6" height="34" fill="#e0a516"/></g>
      <g transform="rotate(-21 40 160)"><rect x="40" y="143" width="105" height="34" rx="5" fill="#2f7fe0"/><path d="M145 143 L175 160 L145 177Z" fill="#225fae"/><rect x="58" y="143" width="6" height="34" fill="#225fae"/><rect x="122" y="143" width="6" height="34" fill="#225fae"/></g>
      <g transform="rotate(4 40 160)"><rect x="40" y="143" width="105" height="34" rx="5" fill="#8bd450"/><path d="M145 143 L175 160 L145 177Z" fill="#5fa22c"/><rect x="58" y="143" width="6" height="34" fill="#5fa22c"/><rect x="122" y="143" width="6" height="34" fill="#5fa22c"/></g>
    </svg>`
  },
  {
    name: "Videos",
    href: "videos/",
    icon: `<svg viewBox="0 0 200 200" aria-hidden="true">
      <path d="M70 22 L100 52 L130 22" fill="none" stroke="#ffc93c" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="18" y="52" width="164" height="118" rx="24" fill="#ff5a5f"/>
      <rect x="36" y="70" width="104" height="82" rx="12" fill="#271f4a"/>
      <path d="M74 92 L110 111 L74 130Z" fill="#ffc93c"/>
      <circle cx="160" cy="88" r="9" fill="#ffc93c"/><circle cx="160" cy="118" r="9" fill="#ffc93c"/>
      <rect x="50" y="170" width="14" height="16" rx="4" fill="#c4434a"/><rect x="136" y="170" width="14" height="16" rx="4" fill="#c4434a"/>
    </svg>`
  },
];

const shelf = document.getElementById("shelf");
const arrow = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4 L19 12 L6 20Z" fill="currentColor"/></svg>';
APPS.forEach(app => {
  const a = document.createElement("a");
  a.className = "app";
  a.href = app.href;
  a.innerHTML = `<div class="box">${app.icon}</div><div class="plank"></div>
    <div class="name">${app.name}</div><div class="go">${arrow}Play</div>`;
  shelf.appendChild(a);
});
</script>
</body>
</html>
